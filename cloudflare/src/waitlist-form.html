<form class="waitlist" id="waitlist" data-waitlist novalidate>
          <label class="sr-only" for="wl-email">Email</label>
          <input id="wl-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <button class="btn btn-primary" type="submit">Notify me</button>
          <p class="wl-msg" role="status" aria-live="polite"></p>
        </form>
