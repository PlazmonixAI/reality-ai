# Render's free plan puts a service to sleep after 15 minutes without traffic. This pings the health
# pages every 10 minutes so the apps stay awake. It waits up to 2 minutes and retries, because a
# sleeping service needs 30 to 60 seconds to start. Run it by hand from the Actions tab to test.
name: Keep servers awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://app.realityasm.com/health
          - https://plazmon-backend.onrender.com/api/v1/health
    steps:
      - name: Ping ${{ matrix.url }}
        run: |
          curl --fail --silent --show-error --location \
            --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
            --write-out '\nHTTP %{http_code} in %{time_total}s\n' \
            "${{ matrix.url }}"
