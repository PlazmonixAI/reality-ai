<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · Reality ASM</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <div class="auth">
    <div class="auth-form">
      <a class="brand" href="/"><img src="/static/brand/mark.svg" alt="" width="55" height="30"><span>Reality <b>ASM</b></span></a>
      <div class="auth-box">
        <h1>Choose a new password</h1>
        <p>Pick something you haven't used here before.</p>
        <form data-form="reset" novalidate>
          <div class="msg" role="alert"></div>
          <label class="field"><span>New password</span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
          <label class="field"><span>Repeat new password</span><input name="confirm" type="password" autocomplete="new-password" required></label>
          <button class="btn btn-primary" type="submit">Save and sign in</button>
        </form>
      </div>
      <p class="auth-foot"><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/cookies">Cookies</a> · © 2026 Plazmonix AI</p>
    </div>
    <div class="auth-art" role="img" aria-label="Saturn in the Reality ASM Solar System">
      <blockquote>Every other session on your account is signed out when you change your password.<cite>Reality ASM</cite></blockquote>
    </div>
  </div>
  <script type="module" src="/static/site.js"></script>
</body>
</html>
