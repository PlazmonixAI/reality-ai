<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password · Reality ASM</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <div class="auth">
    <div class="auth-form">
      <a class="brand" href="/"><img src="/static/brand/mark.svg" alt="" width="55" height="30"><span>Reality <b>ASM</b></span></a>
      <div class="auth-box">
        <h1>Forgot your password?</h1>
        <p>Enter your email and we'll send you a link to choose a new one.</p>
        <form data-form="forgot" novalidate>
          <div class="msg" role="alert"></div>
          <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
          <button class="btn btn-primary" type="submit">Send reset link</button>
          <p class="alt"><a class="link" href="/login">Back to sign in</a></p>
        </form>
      </div>
      <p class="auth-foot"><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/cookies">Cookies</a> · © 2026 Plazmonix AI</p>
    </div>
    <div class="auth-art" role="img" aria-label="Saturn in the Reality ASM Solar System">
      <blockquote>Lost in space happens. Lost passwords shouldn't.<cite>Reality ASM</cite></blockquote>
    </div>
  </div>
  <script type="module" src="/static/site.js"></script>
</body>
</html>
